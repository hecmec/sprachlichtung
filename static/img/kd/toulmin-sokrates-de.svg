<svg width="100%" viewBox="0 0 692 360" role="img" xmlns="http://www.w3.org/2000/svg"><title>Toulmin-Schema für das Sokrates-Argument</title><desc>Toulmin-Schema mit Daten, Schlussregel, Stützung, Schlussfolgerung und Einwand für den Schluss, dass Sokrates sterblich ist.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g><rect x="30" y="40" width="200" height="56" rx="8" fill="rgb(226, 239, 252)" stroke="rgb(147, 190, 236)" stroke-width="1"/>
<text x="130" y="60" text-anchor="middle" dominant-baseline="central" fill="rgb(55, 65, 81)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="14" font-weight="500">Daten</text>
<text x="130" y="80" text-anchor="middle" dominant-baseline="central" fill="rgb(55, 65, 81)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12">Sokrates ist ein Mensch.</text></g>

<g><rect x="462" y="40" width="200" height="56" rx="8" fill="rgb(224, 245, 231)" stroke="rgb(134, 209, 154)" stroke-width="1"/>
<text x="562" y="60" text-anchor="middle" dominant-baseline="central" fill="rgb(55, 65, 81)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="14" font-weight="500">Schlussfolgerung</text>
<text x="562" y="80" text-anchor="middle" dominant-baseline="central" fill="rgb(55, 65, 81)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12">Sokrates ist sterblich.</text></g>

<line x1="230" y1="68" x2="460" y2="68" marker-end="url(#arrow)" fill="none" stroke="rgb(120, 118, 112)" stroke-width="1.5"/>

<g><rect x="246" y="150" width="200" height="56" rx="8" fill="rgb(253, 240, 214)" stroke="rgb(233, 184, 90)" stroke-width="1"/>
<text x="346" y="170" text-anchor="middle" dominant-baseline="central" fill="rgb(55, 65, 81)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="14" font-weight="500">Schlussregel</text>
<text x="346" y="190" text-anchor="middle" dominant-baseline="central" fill="rgb(55, 65, 81)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12">Alle Menschen sind sterblich.</text></g>

<line x1="346" y1="150" x2="346" y2="78" marker-end="url(#arrow)" fill="none" stroke="rgb(120, 118, 112)" stroke-width="1.5"/>

<g><rect x="462" y="150" width="200" height="72" rx="8" fill="rgb(237, 231, 252)" stroke="rgb(178, 158, 240)" stroke-width="1"/>
<text x="562" y="170" text-anchor="middle" dominant-baseline="central" fill="rgb(55, 65, 81)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="14" font-weight="500">Einwand</text>
<text x="562" y="190" text-anchor="middle" dominant-baseline="central" fill="rgb(55, 65, 81)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12">Sokrates ist vielleicht</text>
<text x="562" y="206" text-anchor="middle" dominant-baseline="central" fill="rgb(55, 65, 81)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12">Mensch und Halbgott.</text></g>

<line x1="562" y1="150" x2="562" y2="98" marker-end="url(#arrow)" fill="none" stroke="rgb(120, 118, 112)" stroke-width="1.5" stroke-dasharray="6 4"/>

<g><rect x="246" y="260" width="200" height="72" rx="8" fill="rgb(252, 229, 229)" stroke="rgb(232, 150, 150)" stroke-width="1"/>
<text x="346" y="280" text-anchor="middle" dominant-baseline="central" fill="rgb(55, 65, 81)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="14" font-weight="500">Stützung</text>
<text x="346" y="300" text-anchor="middle" dominant-baseline="central" fill="rgb(55, 65, 81)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12">Bisher ist jeder</text>
<text x="346" y="316" text-anchor="middle" dominant-baseline="central" fill="rgb(55, 65, 81)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif" font-size="12">Mensch gestorben.</text></g>

<line x1="346" y1="260" x2="346" y2="208" marker-end="url(#arrow)" fill="none" stroke="rgb(120, 118, 112)" stroke-width="1.5"/>
</svg>
